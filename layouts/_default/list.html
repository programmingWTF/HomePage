{{ define "main" }}
<div id="overlay" style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 800px;">
    
    <h1 style="margin-bottom: 1rem;">文章列表</h1>
    
    <div class="tag-cloud-container filterable" id="filter-tags" style="margin-bottom: 2.5rem;">
        {{ range $name, $taxonomy := .Site.Taxonomies.tags }}
            <div class="tag-combo active" data-tag="{{ $name | lower }}" style="cursor: pointer;">
                <span class="t-name">{{ $name }}</span>
                <span class="t-count">{{ $taxonomy.Count }}</span>
            </div>
        {{ end }}
    </div>

    <div class="posts-container" id="posts-list" style="max-height: 40vh; overflow-y: auto; padding: 1rem; text-align: left;">
        {{ range .Pages }}
            <div class="post-item" 
                 data-tags="{{ delimit (apply .Params.tags "lower" ".") " " }}" 
                 style="margin-bottom: 20px; border-bottom: 1px solid rgba(0,255,255,0.1); padding-bottom: 10px; display: block;">
                <a href="{{ .RelPermalink }}" style="color: #00ffff; font-size: 1.4rem; text-decoration: none; display: block; margin-bottom: 5px;">
                    {{ .Title | default "未命名文章" }}
                </a>
                <span style="color: #9ca3af; font-size: 0.9rem;">📅 {{ .Date.Format "2006-01-02" }}</span>
                <div style="margin-top: 5px;">
                    {{ range .Params.tags }}
                    <span style="font-size: 0.7rem; color: rgba(0,255,255,0.5); margin-right: 8px;">#{{ . }}</span>
                    {{ end }}
                </div>
            </div>
        {{ end }}
    </div>

    <div style="margin-top: 3rem;">
        <a href="/" class="btn github-btn">← 返回首页</a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tags = document.querySelectorAll('#filter-tags .tag-combo');
    const posts = document.querySelectorAll('#posts-list .post-item');

    tags.forEach(tag => {
        tag.addEventListener('click', () => {
            // 切换选中状态
            tag.classList.toggle('active');
            
            // 获取当前所有选中的标签名
            const activeTags = Array.from(document.querySelectorAll('#filter-tags .tag-combo.active'))
                                   .map(t => t.dataset.tag);

            // 筛选文章
            posts.forEach(post => {
                const postTags = post.dataset.tags.split(' ');
                // 逻辑：如果文章的任何一个标签在选中列表中，就显示
                const isVisible = activeTags.some(t => postTags.includes(t));
                
                if (activeTags.length === 0) {
                    post.style.display = 'none'; // 如果一个标签都没选，全部隐藏
                } else if (isVisible) {
                    post.style.display = 'block';
                } else {
                    post.style.display = 'none';
                }
            });
        });
    });
});
</script>
{{ end }}
