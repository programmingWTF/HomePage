<body>
    
<div id="overlay" style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 800px;">
    
    <h1 style="margin-bottom: 1rem;">文章列表</h1>
    
    <div class="tag-cloud-container filterable" id="filter-tags" style="margin-bottom: 2.5rem;">

            <div class="tag-combo active" data-tag="c语言" style="cursor: pointer;">
                <span class="t-name">c语言</span>
                <span class="t-count">1</span>
            </div>
        
            <div class="tag-combo active" data-tag="layout" style="cursor: pointer;">
                <span class="t-name">layout</span>
                <span class="t-count">1</span>
            </div>
        
            <div class="tag-combo active" data-tag="markdown" style="cursor: pointer;">
                <span class="t-name">markdown</span>
                <span class="t-count">1</span>
            </div>
        
            <div class="tag-combo active" data-tag="技术分享" style="cursor: pointer;">
                <span class="t-name">技术分享</span>
                <span class="t-count">1</span>
            </div>
        
            <div class="tag-combo active" data-tag="样式集成" style="cursor: pointer;">
                <span class="t-name">样式集成</span>
                <span class="t-count">1</span>
            </div>
        
            <div class="tag-combo active" data-tag="测试" style="cursor: pointer;">
                <span class="t-name">测试</span>
                <span class="t-count">1</span>
            </div>
        
            <div class="tag-combo active" data-tag="编程" style="cursor: pointer;">
                <span class="t-name">编程</span>
                <span class="t-count">1</span>
            </div>
        
    </div>

    <div class="posts-container" id="posts-list" style="max-height: 55vh; overflow-y: auto; padding: 0.5rem 1rem; text-align: left;">
        
            <div class="post-item" 
                 data-tags="测试 markdown 样式集成 layout" 
                 style="margin-bottom: 12px; border-bottom: 1px solid rgba(0,255,255,0.1); padding-bottom: 8px; display: block;">
                <a href="/posts/test-all-elements/" style="color: #00ffff; font-size: 1.1rem; text-decoration: none; display: block; margin-bottom: 4px; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#00ffff'">
                    博客全元素渲染测试 (Cyberpunk Theme)
                </a>

                    <span style="font-size: 0.7rem; color: rgba(0,255,255,0.6); margin-right: 8px;">#测试</span>
                    
                    <span style="font-size: 0.7rem; color: rgba(0,255,255,0.6); margin-right: 8px;">#Markdown</span>
                    
                    <span style="font-size: 0.7rem; color: rgba(0,255,255,0.6); margin-right: 8px;">#样式集成</span>

    </div>

    <div style="margin-top: 2rem;">
        <a href="/" class="btn github-btn">← 返回首页</a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tags = document.querySelectorAll('#filter-tags .tag-combo');
    const posts = document.querySelectorAll('#posts-list .post-item');

    function updatePosts() {
        const activeTags = Array.from(document.querySelectorAll('#filter-tags .tag-combo.active'))
                               .map(t => t.dataset.tag);

        posts.forEach(post => {
            const postTags = post.dataset.tags.split(' ');
            const isVisible = activeTags.some(t => postTags.includes(t));
            
            if (activeTags.length === 0) {
                post.style.display = 'none'; 
            } else if (isVisible) {
                post.style.display = 'block';
            } else {
                post.style.display = 'none';
            }
        });
    }

    
    const urlParams = new URLSearchParams(window.location.search);
    const rawTag = urlParams.get('tag');
    const targetTag = rawTag ? rawTag.toLowerCase() : null;

    if (targetTag) {
        
        tags.forEach(t => t.classList.remove('active'));
        
        const targetElement = document.querySelector(`#filter-tags .tag-combo[data-tag="${targetTag}"]`);
        if (targetElement) {
            targetElement.classList.add('active');
        }
    }

    
    updatePosts();

    tags.forEach(tag => {
        tag.addEventListener('click', () => {
            
            tag.classList.toggle('active');
            updatePosts();
        });
    });
});
</script>
