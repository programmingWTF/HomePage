</head>
<body>
    
<div id="overlay" style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 800px;">
    
    <h1 style="margin-bottom: 1rem;">文章列表</h1>
    
    <div class="tag-cloud-container filterable" id="filter-tags" style="margin-bottom: 2.5rem;">
        
            <div class="tag-combo active" data-tag="c/c&#43;&#43;" style="cursor: pointer;">
                <span class="t-name">c/c&#43;&#43;</span>
                <span class="t-count">1</span>
            </div>
        
            <div class="tag-combo active" data-tag="c语言" style="cursor: pointer;">
                <span class="t-name">c语言</span>
                <span class="t-count">1</span>
            </div>
        
            <div class="tag-combo active" data-tag="技术分享" style="cursor: pointer;">
                <span class="t-name">技术分享</span>
                <span class="t-count">1</span>
            </div>
        
            <div class="tag-combo active" data-tag="编程" style="cursor: pointer;">
                <span class="t-name">编程</span>
                <span class="t-count">1</span>
            </div>
        
    </div>

    <div class="posts-container" id="posts-list" style="max-height: 40vh; overflow-y: auto; padding: 1rem; text-align: left;">
        
            <div class="post-item" 
                 data-tags="c语言 编程 技术分享 c/c&#43;&#43;" 
                 style="margin-bottom: 20px; border-bottom: 1px solid rgba(0,255,255,0.1); padding-bottom: 10px; display: block;">
                <a href="/posts/mys/" style="color: #00ffff; font-size: 1.4rem; text-decoration: none; display: block; margin-bottom: 5px;">
                    C语言
                </a>
                <span style="color: #9ca3af; font-size: 0.9rem;">📅 2026-03-31</span>
                <div style="margin-top: 5px;">
                    
                    <span style="font-size: 0.7rem; color: rgba(0,255,255,0.5); margin-right: 8px;">#C语言</span>
                    
                    <span style="font-size: 0.7rem; color: rgba(0,255,255,0.5); margin-right: 8px;">#编程</span>
                    
                    <span style="font-size: 0.7rem; color: rgba(0,255,255,0.5); margin-right: 8px;">#技术分享</span>
                    
                    <span style="font-size: 0.7rem; color: rgba(0,255,255,0.5); margin-right: 8px;">#C/C&#43;&#43;</span>
                    
                </div>
            </div>
        
    </div>

    <div style="margin-top: 3rem;">
        <a href="/" class="btn github-btn">← 返回首页</a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tags = document.querySelectorAll('#filter-tags .tag-combo');
    const posts = document.querySelectorAll('#posts-list .post-item');

    tags.forEach(tag => {
        tag.addEventListener('click', () => {
            
            tag.classList.toggle('active');
            
            
            const activeTags = Array.from(document.querySelectorAll('#filter-tags .tag-combo.active'))
                                   .map(t => t.dataset.tag);

            
            posts.forEach(post => {
                const postTags = post.dataset.tags.split(' ');
                
                const isVisible = activeTags.some(t => postTags.includes(t));
                
                if (activeTags.length === 0) {
                    post.style.display = 'none'; 
                } else if (isVisible) {
                    post.style.display = 'block';
                } else {
                    post.style.display = 'none';
                }
            });
        });
    });
});
</script>
