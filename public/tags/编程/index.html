[!tip] 如何判断自己是否真正掌握了c语言的指针？
看看自己能不能回答以下问题：
定义int a[i]，a[i]与i[a]、(i&#43;1)[a-1]为什么是等价的？ 定义int a[10][20]，传入这个二维数组的时候，为什么传入int a[][20]可以，而传入int a[10][]就不可以？（需要知道具体为什么不可以） 定义int a[10][20]，a是什么类型？a[2]是什么类型？
如果你无法回答上面的全部问题，那么说明你还没完全理解透彻！ 第一节 指针 外卖柜 想象一下，你今天中午要去拿外卖。我们如何保证你能准确的拿到自己的外卖呢？
我们需要知道：你的外卖放在哪个格子里
计算机中的外卖柜 好了，我们现在来类比一下
我们如何在计算机中描述一个数据存储的位置呢？
首先我们要知道，计算机中不同的类型占用的内存是不同的，比如，大部分情况下char占用1个字节，int4个，long long8个。很多时候，我们可能要连续使用好几个外卖柜的格子才能取到外卖
所以我们想准确描述一个变量在计算机中的存储地址，就需要知道：
数据从哪里开始存放 （第一个外卖在哪） 数据存了多长 （连续放了几个外卖格子） 指针到底是怎么取到外卖的 首先，我们定义一个指针
int a; int* p = &amp;amp;amp;a; *p = 3; 先简单讲解一下基本语法。
我们首先定义了一个变量a 然后定义了一个整型指针变量（int*类型）p 接着对a进行取址&amp;amp;amp;，把a的地址给p 最后我们对p进行解引用*，解引用就是找到这个地址对应的东西，*p = 3;也就是让p地址对应的东西（也就是a）的值变成3 [!caution] 注意，int* p;和*p = 5;，这两个*p虽然长得差不多，但是有本质不同！int* p的*可以理解为是跟着前面的int的，意思是定义了一个类型是int*（整型指针类型）的变量p，而*p = 5;的*是上面提到的解引用，是找到这个地址对应的东西
那么，指针变量p到底是怎么工作的？ 我们把计算机内存里的一个字节看作是一个小格子
p里存放的值就是a在计算机内存里的第一个小格子的编号，也就是起始地址（一般来说作为int类型的a会占4个字节） -&amp;amp;gt; 对应第一个外卖格子的编号 那么，谁来记录数据的长度，也就是连续存了几个格子呢？其实这个长度信息存在了指针的类型里。int*类型的指针，它用它的类型int*隐含了“连续存了4个格子”的信息。 同样的，long long *隐含了“连续存了8个格子”的信息、char*隐含了“只存放了1个格子”的信息 好了，至此，指针的基础部分就结束了
第二节 数组与指针 申请一块连续的空间 new与delete 可以理解为new是在贷款，delete是在还款，你不能一直贷款而从不还款 所以，new申请出来的内存一定在使用完后应该使用delete即使还清 基本语法： 申请单个类型为t的变量的内存：new t

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-input');
    
    
    searchInput.addEventListener('focus', function() {
        this.style.boxShadow = '0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0,0,0,0.5)';
        this.style.borderColor = '#00ffff';
    });
    searchInput.addEventListener('blur', function() {
        this.style.boxShadow = 'inset 0 0 10px rgba(0,0,0,0.5)';
        this.style.borderColor = 'rgba(0, 255, 255, 0.3)';
    });

    const tags = document.querySelectorAll('#filter-tags .tag-combo');
    const posts = document.querySelectorAll('#posts-list .post-item');

    function updatePosts() {
        const activeTags = Array.from(document.querySelectorAll('#filter-tags .tag-combo.active'))
                               .map(t => t.dataset.tag);
        const searchQuery = searchInput.value.toLowerCase().trim();

        posts.forEach(post => {
            const postTags = post.dataset.tags.split(' ');
            
            
            let matchTag = false;
            if (activeTags.length === 0) {
                
                matchTag = true;
            } else {
                matchTag = activeTags.some(t => postTags.includes(t));
            }
            
            
            let matchSearch = true;
            if (searchQuery.length > 0) {
                
                
                const textTarget = (post.dataset.content || '') + ' ' + post.innerText;
                if (!textTarget.toLowerCase().includes(searchQuery)) {
                    matchSearch = false;
                }
            }
            
            
            if (matchTag && matchSearch) {
                post.classList.remove('hidden-post');
            } else {
                post.classList.add('hidden-post');
            }
        });
    }

    searchInput.addEventListener('input', updatePosts);

    
    const urlParams = new URLSearchParams(window.location.search);
    const rawTag = urlParams.get('tag');
    const targetTag = rawTag ? rawTag.toLowerCase() : null;

    if (targetTag) {
        
        tags.forEach(t => t.classList.remove('active'));
        
        const targetElement = document.querySelector(`#filter-tags .tag-combo[data-tag="${targetTag}"]`);
        if (targetElement) {
            targetElement.classList.add('active');
        }
    }

    
    updatePosts();

    tags.forEach(tag => {
        tag.addEventListener('click', () => {
            
            tag.classList.toggle('active');
            updatePosts();
        });
    });
});
</script>
