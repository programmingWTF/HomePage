<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-input');
    
    
    searchInput.addEventListener('focus', function() {
        this.style.boxShadow = '0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0,0,0,0.5)';
        this.style.borderColor = '#00ffff';
    });
    searchInput.addEventListener('blur', function() {
        this.style.boxShadow = 'inset 0 0 10px rgba(0,0,0,0.5)';
        this.style.borderColor = 'rgba(0, 255, 255, 0.3)';
    });

    const tags = document.querySelectorAll('#filter-tags .tag-combo');
    const posts = document.querySelectorAll('#posts-list .post-item');

    function updatePosts() {
        const activeTags = Array.from(document.querySelectorAll('#filter-tags .tag-combo.active'))
                               .map(t => t.dataset.tag);
        const searchQuery = searchInput.value.toLowerCase().trim();

        posts.forEach(post => {
            const postTags = post.dataset.tags.split(' ');
            
            
            let matchTag = false;
            if (activeTags.length === 0) {
                
                matchTag = true;
            } else {
                matchTag = activeTags.some(t => postTags.includes(t));
            }
            
            
            let matchSearch = true;
            if (searchQuery.length > 0) {
                
                
                const textTarget = (post.dataset.content || '') + ' ' + post.innerText;
                if (!textTarget.toLowerCase().includes(searchQuery)) {
                    matchSearch = false;
                }
            }
            
            
            if (matchTag && matchSearch) {
                post.classList.remove('hidden-post');
            } else {
                post.classList.add('hidden-post');
            }
        });
    }

    searchInput.addEventListener('input', updatePosts);

    
    const urlParams = new URLSearchParams(window.location.search);
    const rawTag = urlParams.get('tag');
    const targetTag = rawTag ? rawTag.toLowerCase() : null;

    if (targetTag) {
        
        tags.forEach(t => t.classList.remove('active'));
        
        const targetElement = document.querySelector(`#filter-tags .tag-combo[data-tag="${targetTag}"]`);
        if (targetElement) {
            targetElement.classList.add('active');
        }
    }

    
    updatePosts();

    tags.forEach(tag => {
        tag.addEventListener('click', () => {
            
            tag.classList.toggle('active');
            updatePosts();
        });
    });
});
</script>

    <script>
        
        document.addEventListener('DOMContentLoaded', () => {
            const links = document.querySelectorAll('a');
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    
                    if (this.hostname === window.location.hostname && 
                        this.target !== '_blank' && 
                        !this.hasAttribute('download') && 
                        !this.getAttribute('href').startsWith('#') &&
                        !this.href.includes('#')) {
                        
                        e.preventDefault(); 
                        
                        
                        document.body.classList.add('page-fade-out');
                        
                        
                        setTimeout(() => {
                            window.location.href = this.href;
                        }, 350);
                    }
                });
            });
        });
    </script>
